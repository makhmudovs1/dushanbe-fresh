# Read-only production API. Adds only to the device's guest basket; NEVER sends SMS/orders.
appId: tj.dushanbefresh.app.preview
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Все продукты"
    timeout: 30000
# PRODUCT_NAME must be an available product in the first visible catalog row.
# A heading alone is also present in the loading skeleton.
- extendedWaitUntil:
    visible: '(Добавить в корзину|Увеличить количество): ${PRODUCT_NAME}'
    timeout: 60000
- takeScreenshot: ios-home
- scrollUntilVisible:
    element: "${PRODUCT_NAME}"
    direction: DOWN
    timeout: 20000
- runFlow:
    when:
      visible: "Добавить в корзину: ${PRODUCT_NAME}"
    commands:
      - tapOn: "Добавить в корзину: ${PRODUCT_NAME}"
- tapOn: "Корзина"
- extendedWaitUntil:
    visible: "К оплате"
    timeout: 30000
- assertVisible: ${PRODUCT_NAME}
- takeScreenshot: ios-cart
- stopApp
- launchApp
- tapOn: "Корзина"
- assertVisible: ${PRODUCT_NAME}
- takeScreenshot: ios-cart-restored
- tapOn: "Профиль"
- tapOn: "Войти"
- assertVisible: "Введите номер телефона"
- assertVisible: '\+992'
- takeScreenshot: ios-login
# Do not press Continue: the real Payom integration is enabled in production.
