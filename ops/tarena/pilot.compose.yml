name: df-tarena-pilot
x-logging: &logging
  driver: json-file
  options:
    max-size: 5m
    max-file: "2"
services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: pilot_owner
      POSTGRES_DB: df_tarena_test
      POSTGRES_PASSWORD: ${PILOT_DB_OWNER_PASSWORD:?fresh pilot credentials required}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "work_mem=4MB", "-c", "max_connections=20", "-c", "max_parallel_workers_per_gather=1"]
    volumes:
      - pilot_db:/var/lib/postgresql/data
      - ./query.sql:/pilot/query.sql:ro
    networks: [private]
    mem_limit: 384m
    pids_limit: 128
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pilot_owner -d df_tarena_test"]
      interval: 5s
      timeout: 3s
      retries: 15
    logging: *logging
  api:
    image: df-tarena-pilot:8bb9e75
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: "4000"
      DATABASE_URL: postgresql://pilot_api:${PILOT_DB_API_PASSWORD:?fresh pilot credentials required}@postgres:5432/df_tarena_test?schema=public&connection_limit=5
      STAFF_JWT_SECRET: ${PILOT_STAFF_JWT_SECRET:?fresh pilot secret required}
      WEB_ORIGIN: https://localhost:8443
      PRODUCT_IMAGES_DIR: /data/images
      CUSTOMER_AUTH_ENABLED: "false"
      CUSTOMER_REQUIRE_PHONE: "false"
      MOBILE_CUSTOMER_API_ENABLED: "false"
      CUSTOMER_TRUST_LOCAL_PROXY: "false"
      NODE_OPTIONS: --max-old-space-size=192
    volumes:
      - ./images:/data/images
    networks: [private]
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    mem_limit: 384m
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging: *logging
  web:
    image: df-tarena-pilot:8bb9e75
    command: ["start", "--hostname", "0.0.0.0", "--port", "3000"]
    working_dir: /workspace/apps/web
    entrypoint: ["node", "node_modules/next/dist/bin/next"]
    environment:
      NODE_ENV: production
      API_URL: http://api:4000/api/v1
      NODE_OPTIONS: --max-old-space-size=256
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - 127.0.0.1:18080:3000
    networks: [private, edge]
    depends_on: [api]
    init: true
    mem_limit: 512m
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging: *logging
  proxy:
    image: caddy:2
    ports:
      - 127.0.0.1:8443:8443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - pilot_tls:/data
    networks: [edge]
    depends_on: [web]
    mem_limit: 96m
    pids_limit: 128
    restart: unless-stopped
    logging: *logging
networks:
  private:
    internal: true
  edge:
volumes:
  pilot_db:
  pilot_tls:
