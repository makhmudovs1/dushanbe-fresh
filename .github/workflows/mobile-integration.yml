name: Mobile shared identity and purchase integration
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-purchase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: df_mobile_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: dushanbe_fresh_mobile_purchase_test
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U df_mobile_test -d dushanbe_fresh_mobile_purchase_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://df_mobile_test:local-ci-only@127.0.0.1:55439/dushanbe_fresh_mobile_purchase_test
      MOBILE_RUNTIME_CONFIG: /tmp/df-mobile-ci-runtime.json
      MOBILE_TEST_RUNTIME_CONFIG: /tmp/df-mobile-ci-runtime.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dushanbe-fresh/shared build && pnpm db:generate && pnpm db:deploy
      - name: Start guarded local runtime
        run: |
          NODE_ENV=test pnpm --filter @dushanbe-fresh/api exec tsx --tsconfig tsconfig.json test/mobile-runtime.ts > /tmp/mobile-runtime.log 2>&1 &
          node apps/mobile/scripts/wait-for-runtime.mjs
      - name: Guest compatibility, required login, shared WEB/native account and staff lifecycle
        run: pnpm --filter @dushanbe-fresh/mobile exec vitest run src/integration/purchase.integration.test.ts
      - name: Verify Expo compatibility and preview safety
        working-directory: apps/mobile
        run: pnpm exec expo install --check && pnpm check:build
      - name: Verify generated Android R8 inputs
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_APP_ENV: preview
          EXPO_PUBLIC_ENABLE_ORDER_SUBMISSION: "false"
        run: pnpm exec expo prebuild --platform android --no-install && pnpm check:android-startup
      - name: Stop owned fixture
        if: always()
        run: node apps/mobile/scripts/stop-test-runtime.mjs
